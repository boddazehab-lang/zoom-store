<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1A2420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ops Admin">
<title>لوحة التحكم</title>
<link rel="icon" type="image/svg+xml" href="ops-favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="ops-favicon-32.png">
<link rel="apple-touch-icon" href="ops-apple-touch-icon.png">
<link rel="manifest" href="admin.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
  :root{--side:236px}
  body{background:#eef0f2;padding-bottom:env(safe-area-inset-bottom)}
  .bar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top)}
  .bar .in{display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 16px;gap:10px}
  .bar b{font-size:17px;white-space:nowrap}
  .bar .me{font-size:13px;opacity:.75}
  .bar button{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - 56px)}
  nav.side{background:#fff;border-inline-end:1px solid var(--line);padding:12px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;box-sizing:border-box}
  nav.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;margin-bottom:2px}
  nav.side a i{font-style:normal;width:22px;text-align:center}
  nav.side a.on{background:var(--ink);color:#fff}
  nav.side a .badge{margin-inline-start:auto;background:#D9541A;color:#fff;border-radius:999px;font-size:12px;padding:1px 8px}
  nav.side .grp{font-size:12px;color:var(--muted);margin:14px 12px 6px}
  main.content{padding:18px 20px 90px;min-width:0}
  @media (max-width:860px){
    .shell{grid-template-columns:1fr}
    nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-inline-end:0;z-index:30;gap:2px}
    nav.side .grp{display:none}
    nav.side a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;min-width:62px;margin:0;position:relative;flex:none}
    nav.side a i{font-size:18px}
    nav.side a .badge{position:absolute;top:0;inset-inline-end:4px;font-size:10px;padding:0 5px}
    main.content{padding:14px 12px 100px}
    .bar .me{display:none}
  }
  h1.sec{font-size:22px;margin:0 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1.sec .sp{flex:1}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .filters select,.filters input{font:inherit;font-size:14px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .filters input{flex:1;min-width:170px}
  .btn-s{font:inherit;font-size:14px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .btn-s.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn-s.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn-s.wa{background:#1f9d55;color:#fff;border-color:#1f9d55}
  .btn-s.danger{color:#991b1b;border-color:#fecaca;background:#fff5f5}
  .btn-s:disabled{opacity:.5}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .kpi small{color:var(--muted);font-size:13px;display:block;margin-bottom:2px}
  .kpi b{font-size:21px;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3 .sp{flex:1}
  .grid2c{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:1000px){.grid2c{grid-template-columns:1fr}}
  .scroll{overflow-x:auto}
  table.t{width:100%;border-collapse:collapse;font-size:14px}
  table.t th{text-align:right;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
  table.t td{padding:8px;border-bottom:1px solid #EEF0EC;font-variant-numeric:tabular-nums;vertical-align:middle}
  table.t tr.click{cursor:pointer}
  table.t tr.click:hover td{background:#f7f8f6}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tab{border:0;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
  .tab.on{background:var(--brand);color:#fff}
  .tab i{font-style:normal;opacity:.7;margin-inline-start:4px}
  .ord{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1.3fr 1fr auto;gap:10px;align-items:center}
  @media (max-width:860px){.ord{grid-template-columns:1fr}}
  .ord .no{font-weight:800;cursor:pointer}
  .meta{color:var(--muted);font-size:13px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .acts select,.acts a,.acts button{font:inherit;font-size:13px;padding:7px 10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;text-decoration:none;color:var(--ink);cursor:pointer}
  .acts a.wa{background:#1f9d55;color:#fff;border-color:#1f9d55}
  .st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .st-new{background:#fff3cd;color:#8a6100}.st-confirmed{background:#dbeafe;color:#1e40af}.st-shipped{background:#ede9fe;color:#5b21b6}
  .st-delivered{background:#dcfce7;color:#166534}.st-returned{background:#fee2e2;color:#991b1b}.st-cancelled{background:#e5e7eb;color:#374151}
  .pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#f1f3f0;color:#374151;white-space:nowrap}
  .pill.me{background:#e0f2fe;color:#075985}
  .flag{color:#b91c1c;font-weight:700;font-size:12px}
  .rt{font-weight:700;padding:2px 8px;border-radius:999px;font-size:13px}
  .rt.good{background:#dcfce7;color:#166534}.rt.mid{background:#fff3cd;color:#8a6100}.rt.bad{background:#fee2e2;color:#991b1b}
  .pos{color:#166534;font-weight:700}.neg{color:#991b1b;font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .login{max-width:380px;margin:60px auto;padding:0 16px}
  .chart{width:100%;height:auto;display:block}
  .chart rect.b{fill:var(--brand)}
  .chart rect.b:hover{fill:var(--ink)}
  .chart text{font-family:inherit;font-size:11px;fill:#6b7280}
  .chart line{stroke:#e5e7eb}
  .hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:14px;margin:7px 0}
  .hbar .tr{background:#f1f3f0;border-radius:4px;height:12px;overflow:hidden}
  .hbar .fl{background:var(--brand);height:100%;border-radius:0 4px 4px 0}
  .hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ov{position:fixed;inset:0;background:#0007;z-index:50;display:flex;justify-content:flex-start}
  .drawer{background:#f7f8f6;width:min(720px,100%);height:100%;overflow:auto;padding:0 0 40px;box-shadow:0 0 40px #0004}
  .drawer .dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;z-index:2}
  .drawer .dh b{font-size:17px;flex:1}
  .drawer .db{padding:16px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .fgrid .full{grid-column:1/-1}
  @media (max-width:600px){.fgrid{grid-template-columns:1fr}}
  .f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .f input,.f select,.f textarea{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;box-sizing:border-box}
  .f textarea{min-height:84px;resize:vertical;line-height:1.6}
  .f .hint{font-size:12px;color:var(--muted);margin-top:3px}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .timeline li small{color:var(--muted);display:block}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .thumbs .th{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
  .thumbs .th img{width:100%;height:100%;object-fit:cover}
  .thumbs .th button{position:absolute;top:2px;left:2px;border:0;background:#000a;color:#fff;border-radius:6px;font-size:11px;cursor:pointer;padding:1px 5px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .pc{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .pc .im{aspect-ratio:16/10;background:#f1f3f0;position:relative;cursor:pointer}
  .pc .im img{width:100%;height:100%;object-fit:cover}
  .pc .im .pill{position:absolute;top:8px;inset-inline-start:8px}
  .pc .bd{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
  .pc .bd h4{margin:0;font-size:15px;line-height:1.4}
  .pc .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
  .pc.off .im{opacity:.45}
  .switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:#d1d5db;border-radius:999px;transition:.2s;cursor:pointer}
  .switch span:before{content:"";position:absolute;width:18px;height:18px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+span{background:#16a34a}
  .switch input:checked+span:before{transform:translateX(-18px)}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:80;font-size:14px;box-shadow:0 8px 24px #0003;max-width:90vw}
  .lock{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  .lock[hidden]{display:none}
  .lock .ic{font-size:56px}
  .lock button{font:inherit;font-size:17px;padding:14px 26px;border-radius:14px;border:0;background:#D9541A;color:#fff;cursor:pointer}
  .lock a{color:#ffffffaa;font-size:14px}
  .attn{margin:0;padding-inline-start:18px}
  .attn li{margin:6px 0}
  .note{width:100%;font:inherit;font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:5px 8px;margin-top:6px;box-sizing:border-box}
</style>
</head>
<body>
<div class="bar"><div class="in"><b id="title">لوحة التحكم</b><span class="me" id="me"></span><span style="display:flex;gap:6px"><button id="bell" hidden>🔔</button><button id="refresh" hidden>↻</button><button id="logout" hidden>خروج</button></span></div></div>

<section id="loginbox" class="section login" hidden>
  <h2>دخول الأدمن</h2>
  <form id="loginform">
    <div class="field"><label>الإيميل</label><input name="email" type="email" required dir="ltr" autocomplete="username"></div>
    <div class="field"><label>كلمة السر</label><input name="password" type="password" required dir="ltr" autocomplete="current-password"></div>
    <button class="btn btn-primary" style="width:100%">دخول</button>
    <div class="formmsg error" id="loginmsg"></div>
    <p style="text-align:center;margin:12px 0 0"><a href="#" id="forgot" style="font-size:14px">نسيت كلمة السر / أول مرة تدخل؟</a></p>
  </form>
</section>
<section id="setpw" class="section login" hidden>
  <h2>اختار كلمة السر بتاعتك</h2>
  <p class="meta">دي اللي هتدخل بيها لوحة التحكم بعد كده. على الأقل 10 حروف.</p>
  <form id="pwform">
    <div class="field"><label>كلمة السر الجديدة</label><input name="p1" type="password" minlength="10" required dir="ltr" autocomplete="new-password"></div>
    <div class="field"><label>اكتبها تاني</label><input name="p2" type="password" minlength="10" required dir="ltr" autocomplete="new-password"></div>
    <button class="btn btn-primary" style="width:100%">حفظ ودخول</button>
    <div class="formmsg error" id="pwmsg"></div>
  </form>
</section>
<section id="setup" class="section" hidden><h2>لسه محتاج تربط قاعدة البيانات</h2><p>حط supabaseUrl و supabaseAnonKey في config.js.</p></section>

<div class="shell" id="app" hidden>
  <nav class="side" id="nav"></nav>
  <main class="content" id="view"></main>
</div>
<div id="lock" class="lock" hidden>
  <div class="ic">🔒</div>
  <h2 style="margin:0">لوحة التحكم مقفولة</h2>
  <button id="unlock">افتح بالبصمة / Face ID</button>
  <a href="#" id="lockpw">ادخل بكلمة السر بدل كده</a>
</div>

<script src="admin.js?v=2"></script>
</body>
</html>
