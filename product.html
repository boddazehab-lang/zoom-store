<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0F1E33"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="app.js"></script><title>{store}</title></head>
<body data-page="product">
<main class="wrap">
  <nav class="crumbs" aria-label="مسار الصفحة"><a href="index.html">الرئيسية</a> / <span id="crumb"></span></nav>
  <section class="pp" id="pp"></section>
  <section id="extra"></section>
  <section class="order" id="order">
    <div class="order-head"><h2>اطلب دلوقتي</h2><small>مش هتدفع غير لما تستلم</small></div>
    <form id="orderform" novalidate autocomplete="on">
      <div class="col">
        <div class="field"><label for="name">الاسم بالكامل</label><input id="name" name="name" autocomplete="name" required><div class="err"></div></div>
        <div class="field"><label for="phone">رقم الموبايل</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx" dir="ltr" style="text-align:right" required><div class="err"></div></div>
        <div class="row2">
          <div class="field"><label for="gov">المحافظة</label><select id="gov" name="gov" required></select><div class="err"></div></div>
          <div class="field"><label for="city">المدينة / المنطقة</label><input id="city" name="city" required><div class="err"></div></div>
        </div>
        <div class="field"><label for="address">العنوان بالتفصيل</label><input id="address" name="address" autocomplete="street-address" placeholder="الشارع، رقم العمارة، الدور، الشقة" required><div class="err"></div></div>
        <div class="field"><label for="landmark">علامة مميزة جنبك</label><input id="landmark" name="landmark" placeholder="مثال: جنب صيدلية … (بتساعد المندوب يوصلك)"></div>
        <div class="field"><label for="notes">ملاحظات (اختياري)</label><textarea id="notes" name="notes" rows="2"></textarea></div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      </div>
      <div class="col summary-box">
        <label>اختار الكمية</label>
        <div class="offers" id="offers"></div>
        <label class="bump" id="bump" hidden><input type="checkbox" id="bumpcb"><span id="bumptxt"></span></label>
        <div class="summary"><span>الإجمالي شامل الشحن</span><span id="total"></span></div>
        <button type="submit" class="btn btn-primary btn-full">تأكيد الطلب</button>
        <div class="formmsg" id="formmsg"></div>
        <p class="fine">هنكلمك نأكد الطلب قبل الشحن. لو كتبت رقمك ومكمّلتش، ممكن نبعتلك رسالة واحدة نساعدك.</p>
      </div>
    </form>
  </section>
</main>
<div class="buybar" id="buybar"><b class="bb-price"></b><a href="#order" class="btn btn-primary">اطلب دلوقتي</a></div>
</body></html>
